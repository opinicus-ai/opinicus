[workspace]
resolver = "2"
members = [
    "crates/af-core",
    "crates/af-monitor",
    "crates/af-policy",
    "crates/af-provenance",
    "crates/af-recorder",
    "crates/af-approval",
    "crates/af-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/agent-firewall/agent-firewall"

[workspace.dependencies]
af-core = { path = "crates/af-core" }
af-monitor = { path = "crates/af-monitor" }
af-policy = { path = "crates/af-policy" }
af-provenance = { path = "crates/af-provenance" }
af-recorder = { path = "crates/af-recorder" }
af-approval = { path = "crates/af-approval" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["process", "ptrace", "signal", "fs", "user"] }
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
