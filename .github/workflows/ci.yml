# The complete gate, continuously enforced.
#
# [af-10] (M9): every claim the repository makes must be checked on every
# push and pull request. The gate job runs scripts/gate.sh, the same script
# a person runs locally: fmt, clippy, workspace tests, policy tests, e2e,
# quiet-check, the Landlock count-rules drift guard, and the threat-ledger
# checker. No check may be skipped; the gate is red until all of them pass.
#
# Runners: GitHub-hosted ubuntu-24.04 for now. The org's Blacksmith
# installation (app: blacksmith-sh, all repositories) is waiting on their
# support to allowlist the org, so blacksmith-* labels queue forever until
# they unblock us. Migrating back is a three-line swap per job:
#
#   gate:   runs-on: blacksmith-4vcpu-ubuntu-2404
#   docker: runs-on: blacksmith-2vcpu-ubuntu-2404
#           useblacksmith/setup-docker-builder@v1   before buildx use
#           useblacksmith/build-push-action@v2      instead of
#           docker/build-push-action@v7             (colocated layer cache)
#
# Actions are pinned to their latest major versions; every bundled action
# runs its node24 runtime. The repository itself needs no Node toolchain —
# the gate is Rust and Python only.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable, with fmt and clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install the C compiler for the e2e techniques
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: The complete gate
        run: scripts/gate.sh

  # The container image. Built with buildx and the GitHub Actions cache;
  # on Blacksmith the same job switches to their colocated layer cache
  # (40x faster restores) via the swap noted above. The image is loaded
  # and smoke-checked on every run; pushing to a registry is a release
  # action (M14), not a CI action.
  docker:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build the image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          load: true
          tags: agent-firewall:ci
          push: false

      - name: Smoke-check the image
        run: docker run --rm agent-firewall:ci --help
