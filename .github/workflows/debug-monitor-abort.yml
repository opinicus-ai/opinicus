# One-shot diagnostic: catch the rare IO-safety abort in af-monitor's test
# suite with a backtrace. Not part of the gate; dispatch manually.
name: debug-monitor-abort

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: "Catch the abort under gdb"
        run: |
          mkdir -p /tmp/looplog
          sudo apt-get update -q && sudo apt-get install -y -q gdb
          cargo test -p af-monitor --lib --no-run 2>/dev/null
          BIN=$(ls -t target/debug/deps/af_monitor-* | grep -v '\.d$' | head -1)
          echo "test binary: $BIN"
          for i in $(seq 1 60); do
            yes > /dev/null & yes > /dev/null &
            LOAD=$(jobs -p)
            if ! gdb --batch -ex run -ex bt -ex "thread apply all bt 12" --args "$BIN" > "/tmp/looplog/gdb-$i.log" 2>&1; then
              kill $LOAD 2>/dev/null || true
              echo "iteration $i crashed; gdb log follows"; cat "/tmp/looplog/gdb-$i.log"; exit 1
            fi
            kill $LOAD 2>/dev/null || true; wait 2>/dev/null || true
            grep -q "IO Safety" "/tmp/looplog/gdb-$i.log" && { echo "abort at iteration $i"; cat "/tmp/looplog/gdb-$i.log"; exit 1; }
            printf 'iteration %d clean\n' "$i"
          done
          printf "60 gdb-guarded iterations clean\n"

      - name: Upload the loop log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-abort-hunt
          path: /tmp/looplog/
          if-no-files-found: warn
