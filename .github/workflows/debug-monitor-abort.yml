# One-shot diagnostic: catch the rare IO-safety abort in af-monitor's test
# suite with a backtrace. Not part of the gate; dispatch manually.
name: debug-monitor-abort

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: "Narrow the abort - serial suite, then the suspect pair in parallel"
        env:
          RUST_BACKTRACE: full
        run: |
          mkdir -p /tmp/looplog
          echo "=== A: the whole af-monitor lib, serial, 30 iterations"
          for i in $(seq 1 30); do
            if ! cargo test -p af-monitor --lib -- --test-threads=1 > "/tmp/looplog/serial-$i.log" 2>&1; then
              echo "serial iteration $i failed"; cat "/tmp/looplog/serial-$i.log"; exit 1
            fi
            printf 'serial %d green\n' "$i"
          done
          echo "=== B: the suspect tests together, default threads, 150 iterations"
          for i in $(seq 1 150); do
            yes > /dev/null &
            LOAD=$!
            if ! cargo test -p af-monitor --lib -- a_connection_is_observed_with_its_address_and_port a_foreign_child_exit_never_enters_the_session_events > "/tmp/looplog/pair-$i.log" 2>&1; then
              kill $LOAD 2>/dev/null || true
              echo "pair iteration $i failed"; cat "/tmp/looplog/pair-$i.log"; exit 1
            fi
            kill $LOAD 2>/dev/null || true; wait 2>/dev/null || true
            printf 'pair %d green\n' "$i"
          done
          printf 'narrowing complete, no abort\n'

      - name: Upload the loop log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-abort-hunt
          path: /tmp/looplog/
          if-no-files-found: warn
