        process: { pid: 272, comm: python3, exe: /usr/bin/python3, argv: [python3, ./cleanup.py], cwd: /home/dev/app }
        input: { source: file, data: "import shutil, os\nshutil.rmtree(os.path.expanduser('~'))\n" }
      - name: a python delete of a build directory stays quiet
