        expect: allow
        expect_match: true
        process: { pid: 360, comm: rm, exe: /usr/bin/rm, argv: [rm, -f, "~/.bashrc"], cwd: /home/dev/app }
        ancestry: [{ comm: bash }, { comm: claude }]
      - name: a rewrite of the profile file is reported
        expect: allow
        expect_match: true
        process: { pid: 361, comm: tee, exe: /usr/bin/tee, argv: [tee, /home/dev/.profile] }
      - name: an append to the shell startup file stays quiet
        expect: allow
        process: { pid: 362, comm: tee, exe: /usr/bin/tee, argv: [tee, -a, "~/.bashrc"] }
      - name: a change of a project file stays quiet
        expect: allow
        process: { pid: 363, comm: sed, exe: /usr/bin/sed, argv: [sed, -i, "s/a/b/", ./src/main.rs], cwd: /home/dev/app }

  # sources: research/threats/scenarios/fs.md (SC Deletion of database files and backup files)
  - id: filesystem.data.destroy-file
    title: Deletion or emptying of a database file or a backup file
    category: filesystem
    risk: suspicious
    decision: allow
    reason: The command deletes or empties a database file or a backup file. No database program runs, so no rule of the database pack sees this step.
    match:
      action: exec
      program: [rm, mv, unlink, shred, truncate, cp, sh, bash, zsh, dash, ksh, sudo, doas, env, xargs, busybox]
      any_of:
        - all_of:
            - argv_matches: '(?:^|\s)(?:rm|mv|unlink|shred)(?:\s|$)'
            - any_of:
                - argv_matches: '(?:^|\s)[\x22\x27]?\S*\.(?:sqlite|sqlite3|db|rdb|dump|bak|mdb|sql\.gz|sql\.bz2|sql\.zst|tar\.gz\.enc)[\x22\x27]?(?:\s|$)'
                - argv_matches: '(?:^|\s)[\x22\x27]?\S*(?:backup|backups|dumps|snapshots)/\S+'
        - all_of:
            - argv_matches: '(?:^|\s)truncate(?:\s|$)'
            - argv_matches: '(?:^|\s)(?:-s|--size)[= ]?\s?0(?:\s|$)'
            - argv_matches: '(?:^|\s)[\x22\x27]?\S*\.(?:sqlite|sqlite3|db|rdb|dump|bak|mdb|csv|sql\.gz)[\x22\x27]?(?:\s|$)'
        - argv_matches: '(?:^|\s)cp\s+(?:-\S+\s+)*/dev/null\s+\S'
    tests:
      - name: a delete of a database file is reported
        expect: allow
        expect_match: true
        process: { pid: 370, comm: rm, exe: /usr/bin/rm, argv: [rm, app.db], cwd: /home/dev/app }
        ancestry: [{ comm: bash }, { comm: claude }]
      - name: a delete of a backup file is reported
        expect: allow
        expect_match: true
        process: { pid: 371, comm: rm, exe: /usr/bin/rm, argv: [rm, -f, backups/prod-2026-08-01.dump], cwd: /home/dev/app }
      - name: an empty write over a data file is reported
        expect: allow
        expect_match: true
        process: { pid: 372, comm: truncate, exe: /usr/bin/truncate, argv: [truncate, -s, "0", data/app.sqlite], cwd: /home/dev/app }
      - name: a copy of the empty device over a dump is reported
        expect: allow
        expect_match: true
        process: { pid: 373, comm: cp, exe: /usr/bin/cp, argv: [cp, /dev/null, dump.sql.gz], cwd: /home/dev/app }
      - name: an empty write over a log file stays quiet
        expect: allow
        process: { pid: 374, comm: truncate, exe: /usr/bin/truncate, argv: [truncate, -s, "0", app.log], cwd: /home/dev/app }
      - name: a delete of a migration file stays quiet
        expect: allow
        process: { pid: 375, comm: rm, exe: /usr/bin/rm, argv: [rm, migrations/001_init.sql], cwd: /home/dev/app }
      - name: a delete of the build output stays quiet
        expect: allow
        process: { pid: 376, comm: rm, exe: /usr/bin/rm, argv: [rm, -rf, ./target], cwd: /home/dev/app }
