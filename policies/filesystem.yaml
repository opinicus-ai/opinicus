  - id: filesystem.perm.recursive-system-tree
    title: Recursive permission change of a system tree or of the home directory
    category: filesystem
    risk: approval_required
    decision: approval_required
    reason: The command changes the rights of every file in a system tree or in the whole home directory. The old rights are gone, the user can lose access, and the machine can stop working.
    match:
      action: exec
      program: [chmod, chown, chgrp, sudo, doas, sh, bash, zsh, dash, ksh, env, xargs, busybox]
      all_of:
        - argv_matches: '(?:^|\s)(?:\S*/)?(?:chmod|chown|chgrp)(?:\s|$)'
        - argv_matches: '(?:^|\s)(?:-[a-zA-Z]*R[a-zA-Z]*|--recursive)(?:\s|$)'
        - argv_matches: '(?:^|\s)[\x22\x27]?(?:/|~|\$HOME|\$\{HOME\}|/home|/home/[^/\s\x22\x27]+|/Users|/Users/[^/\s\x22\x27]+|/root|/etc|/usr|/var|/bin|/sbin|/lib|/lib64|/boot|/opt|/srv)/?[\x22\x27]?(?:\s|$)'
    tests:
      - name: a recursive permission change of the whole file system needs approval
        expect: approval_required
        process: { pid: 280, comm: chmod, exe: /usr/bin/chmod, argv: [chmod, -R, "777", /], cwd: /home/dev/app }
        ancestry: [{ comm: bash }, { comm: claude }]
      - name: a recursive owner change of a system tree needs approval
        expect: approval_required
        process: { pid: 281, comm: sudo, exe: /usr/bin/sudo, argv: [sudo, chown, -R, "dev:dev", /usr] }
      - name: a recursive permission change of the home directory needs approval
        expect: approval_required
        process: { pid: 282, comm: chmod, exe: /usr/bin/chmod, argv: [chmod, -R, "000", /home/dev] }
      - name: a recursive permission change in the project stays quiet
        expect: allow
        process: { pid: 283, comm: chmod, exe: /usr/bin/chmod, argv: [chmod, -R, "755", ./scripts], cwd: /home/dev/app }
      - name: a recursive permission change of a web directory stays quiet
        expect: allow
        process: { pid: 284, comm: chmod, exe: /usr/bin/chmod, argv: [chmod, -R, "777", /var/www] }
      - name: a recursive owner change of a local install directory stays quiet
        expect: allow
        process: { pid: 285, comm: sudo, exe: /usr/bin/sudo, argv: [sudo, chown, -R, "dev:dev", /usr/local] }

