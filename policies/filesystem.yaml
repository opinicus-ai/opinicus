        - argv_matches: '(?:^|\s)[\x22\x27]?(?:~|\$HOME|\$\{HOME\}|/home/[^/\s\x22\x27]+|/Users/[^/\s\x22\x27]+|/root)/\.(?:bashrc|bash_profile|bash_login|bash_logout|profile|zshrc|zprofile|zshenv|zlogin|gitconfig|vimrc|tmux\.conf|inputrc|config/git/config|config/fish/config\.fish)[\x22\x27]?(?:\s|$)'
    exceptions:
