  - id: filesystem.delete.work-tree-self
    title: Recursive deletion of the work tree itself
    category: filesystem
    risk: suspicious
    decision: allow
    reason: The command deletes the project directory itself. Every change that is not committed and every file that Git does not track goes away.
    match:
      any_of:
        - action: exec
          program: [rm, sh, bash, zsh, dash, ksh, fish, sudo, doas, env, xargs, timeout, nice, busybox]
          all_of:
            - argv_matches: '(?:^|\s)rm(?:\s|$)'
            - argv_matches: '(?:^|\s)(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s|$)'
            - argv_matches: '(?:^|\s)[\x22\x27]?(?:\.|\./|\$PWD|\$\{PWD\}|\$\(pwd\)|`pwd`|\*)/?[\x22\x27]?(?:\s|$)'
        - action: input
          all_of:
            - input_matches: '(?:^|\s)rm(?:\s|$)'
            - input_matches: '(?:^|\s)(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s|$)'
            - input_matches: '(?:^|\s)[\x22\x27]?(?:\.|\./|\$PWD|\$\{PWD\}|\$\(pwd\)|`pwd`|\*)/?[\x22\x27]?(?:\s|$)'
    tests:
      - name: a delete of the current directory is reported
        expect: allow
        expect_match: true
        process: { pid: 310, comm: rm, exe: /usr/bin/rm, argv: [rm, -rf, "."], cwd: /home/dev/app }
        ancestry: [{ comm: bash }, { comm: claude }]
      - name: a delete of the working directory variable is reported
