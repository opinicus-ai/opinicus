  - id: filesystem.move.destructive
    title: Move of many files onto one destination
    category: filesystem
    risk: suspicious
    decision: allow
    reason: The move has a wildcard or many sources. If the destination is not a directory, every file goes onto the same name and only the last file stays.
    references: ["https://github.com/google-gemini/gemini-cli/issues/4586"]
    match:
      action: exec
      program: [mv, sh, bash, zsh, dash, ksh, sudo, doas, env, busybox]
      any_of:
        - all_of:
            - argv_matches: '(?:^|\s)(?:\S*/)?mv(?:\s+-[^\s]+)*(?:\s+[^-\s]\S*){3,}\s*$'
            - not:
                argv_matches: '/[\x22\x27]?\s*$'
            - not:
                argv_matches: '(?:^|\s)(?:-t|--target-directory)(?:\s|=|$)'
        - all_of:
            - argv_matches: '(?:^|\s)(?:\S*/)?mv(?:\s|$)'
            - argv_matches: '(?:^|\s)[^\s]*[*?][^\s]*(?:\s|$)'
    tests:
      - name: a move of many files onto one name is reported
        expect: allow
        expect_match: true
        process: { pid: 330, comm: mv, exe: /usr/bin/mv, argv: [mv, a.txt, b.txt, c.txt, dest.txt], cwd: /home/dev/app }
        ancestry: [{ comm: bash }, { comm: gemini }]
      - name: a move with a wildcard is reported
        expect: allow
        expect_match: true
        process: { pid: 331, comm: bash, exe: /usr/bin/bash, argv: [bash, -c, "mv * \"../my project\""], cwd: /home/dev/app }
      - name: a rename of one file stays quiet
        expect: allow
        process: { pid: 332, comm: mv, exe: /usr/bin/mv, argv: [mv, src/a.rs, src/b.rs], cwd: /home/dev/app }
      - name: a move into a directory stays quiet
        expect: allow
        process: { pid: 333, comm: mv, exe: /usr/bin/mv, argv: [mv, a.txt, b.txt, docs/], cwd: /home/dev/app }
      - name: a move with an explicit target directory stays quiet
        expect: allow
        process: { pid: 334, comm: mv, exe: /usr/bin/mv, argv: [mv, -t, docs, a.txt, b.txt, c.txt], cwd: /home/dev/app }

