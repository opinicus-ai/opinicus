  - id: filesystem.mirror.rsync-delete
    title: Copy that deletes files at the destination
    category: filesystem
    risk: suspicious
    decision: allow
    reason: The copy removes every file at the destination that is not in the source. A wrong source or a wrong destination empties a whole directory.
    references: ["https://download.samba.org/pub/rsync/rsync.1"]
    match:
      action: exec
      program: [rsync, sh, bash, zsh, dash, ksh, sudo, doas, env, busybox]
      all_of:
        - argv_matches: '(?:^|\s)(?:\S*/)?rsync(?:\s|$)'
        - argv_matches: '(?:^|\s)--del(?:ete(?:-(?:before|during|delay|after|excluded))?)?(?:\s|$)'
    exceptions:
      - argv_matches: '(?:^|\s)(?:--dry-run|-[a-zA-Z]*n[a-zA-Z]*)(?:\s|$)'
    tests:
      - name: a mirror copy that deletes at the destination is reported
        expect: allow
        expect_match: true
        process: { pid: 320, comm: rsync, exe: /usr/bin/rsync, argv: [rsync, -a, --delete, ./build/, /srv/app-current/], cwd: /home/dev/app }
        ancestry: [{ comm: bash }, { comm: claude }]
      - name: a normal copy stays quiet
        expect: allow
        process: { pid: 321, comm: rsync, exe: /usr/bin/rsync, argv: [rsync, -a, ./build/, ./deploy/], cwd: /home/dev/app }
      - name: a dry run of a mirror copy stays quiet
        expect: allow
        process: { pid: 322, comm: rsync, exe: /usr/bin/rsync, argv: [rsync, -an, --delete, ./build/, /srv/app-current/], cwd: /home/dev/app }

