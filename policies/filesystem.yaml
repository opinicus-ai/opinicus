  - id: filesystem.delete.unresolved-variable
    title: Recursive deletion of a path that comes from a variable
    category: filesystem
    risk: suspicious
    decision: allow
    reason: The command builds the delete target from a shell variable. An empty or wrong variable moves the delete to the root directory or to the home directory.
    match:
      any_of:
        - action: exec
          program: [sh, bash, zsh, dash, ksh, fish, sudo, doas, env, busybox, make, npm, pnpm, yarn]
          all_of:
            - argv_matches: '(?:^|\s)rm(?:\s|$)'
            - argv_matches: '(?:^|\s)(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s|$)'
            - argv_matches: '(?:^|\s)[\x22\x27]?\$\{?[A-Za-z_][A-Za-z0-9_]*(?::[-?=+][^}\s]*)?\}?(?:[\x22\x27]|/|\s|$)'
        - action: input
          all_of:
            - input_matches: '(?:^|\s)rm(?:\s|$)'
            - input_matches: '(?:^|\s)(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)(?:\s|$)'
            - input_matches: '(?:^|\s)[\x22\x27]?\$\{?[A-Za-z_][A-Za-z0-9_]*(?::[-?=+][^}\s]*)?\}?(?:[\x22\x27]|/|\s|$)'
    exceptions:
      - argv_matches: '\$\{[A-Za-z_][A-Za-z0-9_]*:[-?=+]'
      - input_matches: '\$\{[A-Za-z_][A-Za-z0-9_]*:[-?=+]'
    tests:
      - name: an empty variable in a delete is reported
        expect: allow
        expect_match: true
        process: { pid: 290, comm: bash, exe: /usr/bin/bash, argv: [bash, -c, "BUILD_DIR=\"\"; rm -rf \"$BUILD_DIR/\""], cwd: /home/dev/app }
        ancestry: [{ comm: claude }]
      - name: a variable target in the standard input is reported
        expect: allow
        expect_match: true
        process: { pid: 291, comm: bash, exe: /usr/bin/bash, argv: [bash, -s] }
        input: { source: stdin, data: "rm -rf $TARGET/sub\n" }
      - name: a guarded variable stays quiet
        expect: allow
        process: { pid: 292, comm: bash, exe: /usr/bin/bash, argv: [bash, -c, "rm -rf \"${BUILD_DIR:?}/dist\""], cwd: /home/dev/app }
      - name: a delete of a fixed build path stays quiet
        expect: allow
        process: { pid: 293, comm: bash, exe: /usr/bin/bash, argv: [bash, -c, "rm -rf ./target"], cwd: /home/dev/app }

